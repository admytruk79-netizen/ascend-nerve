name: ASCEND Visual Preview

on:
  push:
    branches: [ ascend-path-foundation ]
    paths:
      - 'mobile-app/www/**'
      - 'mobile-app/tests/visual-capture.mjs'
      - '.github/workflows/visual-preview.yml'
  pull_request:
    branches: [ main, ascend-path-foundation ]
    paths:
      - 'mobile-app/www/**'
      - 'mobile-app/tests/visual-capture.mjs'
      - '.github/workflows/visual-preview.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          n=0
          until [ $n -ge 5 ]; do
            npx playwright install --with-deps chromium && break
            n=$((n+1))
            echo "Chromium install failed (attempt $n/5); dl.google.com's chrome-stable apt repo lags its own Release hash briefly -- retrying in $((n*15))s"
            sleep $((n*15))
          done
          if [ $n -ge 5 ]; then
            echo "::error::Chromium install failed after 5 attempts"
            exit 1
          fi
      - name: Start local app
        run: python3 -m http.server 4173 --directory www >/tmp/ascend-visual-http.log 2>&1 &
      - name: Capture Day Twilight Night
        run: node tests/visual-capture.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ascend-today-visual-preview
          path: mobile-app/visual-preview/*.png
          if-no-files-found: error
          retention-days: 7
