name: ASCEND Path Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["ascend-path-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Run app tests
        run: npm test
      - name: Enable QA access for this debug artifact
        run: sed -i '1iwindow.__ASCEND_QA_ACCESS__=true;' www/app.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-path-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
