name: Build ASCEND Path Android Debug

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install --no-audit --no-fund

      - name: Run ASCEND engine tests
        working-directory: mobile-app
        run: npm test

      - name: Create Android shell if needed
        working-directory: mobile-app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-path-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
