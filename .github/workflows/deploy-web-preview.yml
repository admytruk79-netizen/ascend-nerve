name: Deploy ASCEND Path Web Preview

# deploy source: ascend-path-foundation

on:
  push:
    branches: [ ascend-path-foundation ]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: mobile-app
        run: npm install --no-audit --no-fund
      - name: Run ASCEND engine tests
        working-directory: mobile-app
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-app/www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
