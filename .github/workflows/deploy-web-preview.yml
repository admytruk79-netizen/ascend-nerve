name: Deploy ASCEND Path Web Preview

# deploy source: ascend-path-foundation

on:
  push:
    branches: [ ascend-path-foundation ]
    paths:
      - 'mobile-app/www/**'
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true so this action turns Pages on via the API on first
      # run -- it defaults to false, which 404s ("Get Pages site failed")
      # against a repo where Pages has never been enabled in Settings.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-app/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
